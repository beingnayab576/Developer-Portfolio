<!DOCTYPE html>
<html lang="en" data-theme="system">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact me through my developer portfolio website.">

    <title>Contact | My Portfolio</title>

    <!-- css file connect ki hai -->
    <link rel="stylesheet" href="style.css">

    <!-- javascript file connect ki hai -->
    <script src="app.js" defer></script>
</head>

<body>

    <!-- website ka header -->
    <header>
        <nav class="navbar" aria-label="Main navigation">

            <a href="index.html" class="logo">My Portfolio</a>

            <!-- navigation links -->
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html" aria-current="page">Contact</a></li>
            </ul>

            <!-- dark mode button -->
            <button type="button" id="theme-toggle" aria-pressed="false">
                Dark Mode
            </button>

        </nav>
    </header>

    <!-- main content -->
    <main>

        <section class="contact-section" aria-labelledby="contact-heading">

            <h1 id="contact-heading">Contact Me</h1>

            <p>Feel free to send me a message.</p>

            <!-- contact form -->
            <form id="contact-form" novalidate>

                <!-- name field -->
                <div class="form-group">

                    <label for="name">Your Name:</label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        minlength="3"
                        required
                        aria-describedby="name-error"
                    >

                    <small id="name-error" class="error" aria-live="polite"></small>

                </div>

                <!-- email field -->
                <div class="form-group">

                    <label for="email">Your Email:</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                        aria-describedby="email-error"
                    >

                    <small id="email-error" class="error" aria-live="polite"></small>

                </div>

                <!-- subject dropdown -->
                <div class="form-group">

                    <label for="subject">Subject:</label>

                    <select
                        id="subject"
                        name="subject"
                        required
                        aria-describedby="subject-error"
                    >
                        <option value="">Select Subject</option>
                        <option value="Project Discussion">Project Discussion</option>
                        <option value="Internship">Internship</option>
                        <option value="General Question">General Question</option>
                    </select>

                    <small id="subject-error" class="error" aria-live="polite"></small>

                </div>

                <!-- message field -->
                <div class="form-group">

                    <label for="message">Your Message:</label>

                    <textarea
                        id="message"
                        name="message"
                        minlength="20"
                        required
                        aria-describedby="message-error"
                    ></textarea>

                    <small id="message-error" class="error" aria-live="polite"></small>

                </div>

                <!-- radio buttons -->
                <fieldset>

                    <legend>How did you hear about me?</legend>

                    <label for="google">
                        <input type="radio" id="google" name="source"
                            value="Google" required>
                        Google
                    </label>

                    <label for="social">
                        <input type="radio" id="social" name="source"
                            value="Social Media">
                        Social Media
                    </label>

                    <label for="friend">
                        <input type="radio" id="friend" name="source"
                            value="Friend">
                        Friend
                    </label>

                    <label for="other">
                        <input type="radio" id="other" name="source"
                            value="Other">
                        Other
                    </label>

                    <small id="source-error" class="error" aria-live="polite"></small>

                </fieldset>

                <!-- consent checkbox -->
                <div class="form-group">

                    <label for="consent">
                        <input
                            type="checkbox"
                            id="consent"
                            name="consent"
                            required
                        >
                        I agree to be contacted through my provided details.
                    </label>

                    <small id="consent-error" class="error" aria-live="polite"></small>

                </div>

                <!-- submit button -->
                <button type="submit">Send Message</button>

                <!-- success message -->
                <p id="form-success" role="status" aria-live="polite"></p>

            </form>

        </section>

    </main>

    <!-- website ka footer -->
    <footer>
        <p>&copy; 2026 My Portfolio. All Rights Reserved.</p>

        <nav aria-label="Footer navigation">
            <a href="index.html">Home</a>
            <a href="projects.html">Projects</a>
            <a href="contact.html">Contact</a>
        </nav>
    </footer>

</body>
</html>
